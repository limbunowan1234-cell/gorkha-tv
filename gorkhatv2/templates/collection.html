  <style id="page-style">
    .coll-wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px 60px; }
    .coll-badge {
      display: inline-block; font-family: 'Anek Latin', 'Anek Devanagari', sans-serif; font-size: 13px; font-weight: 700;

    }
    .coll-title { font-family: 'Anek Latin', 'Anek Devanagari', sans-serif; font-size: 36px; font-weight: 600; margin-bottom: 8px; }
    .coll-intro { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 28px; max-width: 720px; }
    .coll-list { display: flex; flex-direction: column; gap: 4px; }
    .coll-row { display: flex; align-items: center; gap: 14px; padding: 8px; border-radius: 6px; transition: background 0.15s; color: inherit; text-decoration: none; }
    .coll-row:hover { background: var(--surface2); }
    .coll-rank { font-family: 'Anek Latin', 'Anek Devanagari', sans-serif; font-size: 26px; font-weight: 600; color: var(--muted); width: 44px; text-align: center; flex-shrink: 0; }
    .coll-row:nth-child(-n+3) .coll-rank { color: var(--red); }
    .coll-thumb { width: 120px; aspect-ratio: 16/9; border-radius: 4px; overflow: hidden; flex-shrink: 0; background: var(--surface2); }
    .coll-thumb.round { width: 64px; aspect-ratio: 1; border-radius: 50%; margin: 0 28px; }
    .coll-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .coll-info { min-width: 0; flex: 1; }
    .coll-row-title { font-family: 'Anek Latin', 'Anek Devanagari', sans-serif; font-size: 14px; font-weight: 800; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .coll-row-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .coll-section { margin-top: 40px; }
    .coll-section h2 { font-family: 'Anek Latin', 'Anek Devanagari', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    .coll-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .coll-links a { font-size: 13px; padding: 6px 14px; border-radius: 20px; background: var(--surface2); color: inherit; text-decoration: none; }
    .coll-links a:hover { background: var(--red); color: #fff; }
    .coll-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .coll-card { display: block; padding: 16px; border-radius: 8px; background: var(--surface2); color: inherit; text-decoration: none; transition: transform 0.15s; }
    .coll-card:hover { transform: translateY(-2px); }
    .coll-card strong { display: block; font-family: 'Anek Latin', 'Anek Devanagari', sans-serif; font-size: 16px; margin-bottom: 4px; }
    .coll-card span { font-size: 12px; color: var(--muted); }
    @media (max-width: 700px) {
      .coll-wrap { padding: 20px 16px 40px; }
      .coll-title { font-size: 28px; }
      .coll-thumb { width: 90px; }
      .coll-thumb.round { width: 52px; margin: 0 19px; }
    }
