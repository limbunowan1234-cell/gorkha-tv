  <style id="page-style">
    /* Every accent on this page reads off --red (row-title bar, see-all
       hover, CTA button) — genre.js retints --red to the genre's own color
       on load, so the whole page picks up the theme with no per-element
       overrides needed. */
    .genre-hero {
      padding: 48px 24px 28px; text-align: center; border-bottom: 1px solid var(--border);
      background-image: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%), var(--terrace-pattern, none);
      background-repeat: no-repeat, repeat;
    }
    .genre-hero-label { font-family: 'Anek Latin', 'Anek Devanagari', sans-serif; font-size: 42px; font-weight: 700; color: var(--red); letter-spacing: 0.5px; }
    .genre-hero-sub { color: var(--muted); font-size: 13px; margin-top: 8px; max-width: 520px; margin-left: auto; margin-right: auto; }
    .genre-wrap { max-width: 1400px; margin: 0 auto; }
    .genre-cta-wrap { padding: 8px 48px 40px; text-align: center; }
    .genre-cta-btn {
      display: inline-block; background: var(--red); color: #000; font-weight: 700; font-size: 14px;
      padding: 12px 28px; border-radius: 4px; transition: opacity 0.2s;
    }
    .genre-cta-btn:hover { opacity: 0.85; }
    .genre-empty { color: var(--muted); font-size: 13px; padding: 40px 48px; text-align: center; background-image: var(--terrace-pattern, none); background-repeat: repeat; }

    /* Sticky quick-jump menu — sits right under the main <nav> (which is
       itself sticky at top:0, height 64px), so top:64px here stacks the two
       rather than overlapping. Same-page items (Trending/Latest/Top
       Artists/By Region) scroll to an anchor and get their .active state
       toggled by an IntersectionObserver in genre.js; cross-page items
       (Top 100, CHIMAL's per-category links) are plain links with no
       active-tracking, since navigating away makes that moot. */
    .genre-subnav {
      position: sticky; top: 64px; z-index: 90;
      display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
      padding: 0 48px; background: rgba(8,8,8,0.98); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .genre-subnav::-webkit-scrollbar { display: none; }
    .genre-subnav a {
      flex-shrink: 0; padding: 14px 14px; font-size: 13px; font-weight: 700;
      color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .genre-subnav a.active, .genre-subnav a:hover { color: var(--text); border-color: var(--red); }
    @media (max-width: 700px) {
      .genre-subnav { padding: 0 20px; top: 64px; }
      .genre-subnav a { padding: 12px 10px; font-size: 12px; }
    }

    /* TOP ARTISTS — a compact rank list (round avatar, not a 16:9 thumb —
       this ranks people/channels, not individual videos), 2 columns on
       desktop so 20 entries don't turn into one very long scroll. */
    .artist-list {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 24px;
      padding: 0 48px 8px;
    }
    .artist-row {
      display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 6px;
      transition: background 0.15s;
    }
    .artist-row:hover { background: var(--surface2); }
    .artist-rank {
      font-family: 'Anek Latin', 'Anek Devanagari', sans-serif; font-size: 22px; font-weight: 600; color: var(--red);
      width: 30px; text-align: center; flex-shrink: 0;
    }
    .artist-avatar {
      width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--surface2);
    }
    .artist-info { min-width: 0; }
    .artist-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .artist-stats { font-size: 12px; color: var(--muted); margin-top: 2px; }
    @media (max-width: 700px) {
      .genre-hero { padding: 32px 20px 20px; }
      .genre-hero-label { font-size: 30px; }
      .genre-cta-wrap { padding: 8px 20px 32px; }
      .artist-list { grid-template-columns: 1fr; padding: 0 20px 8px; }
    }
  </style>
</head>
