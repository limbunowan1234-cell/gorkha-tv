<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator | GorkhaTV</title>
  <link rel="icon" type="image/png" href="/logo-circle.png">
  <link rel="stylesheet" href="/css/style.css">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5223539471824662" crossorigin="anonymous"></script>
  <script type="text/javascript"> var infolinks_pid = 3447537; var infolinks_wsid = 0; </script>
  <script type="text/javascript" src="https://resources.infolinks.com/js/infolinks_main.js"></script>
  <style>
    .creator-wrap { max-width: 1400px; margin: 0 auto; padding: 32px 48px 60px; }
    .creator-hero { display: flex; gap: 20px; align-items: center; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .creator-hero img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
    .creator-name { font-family: 'Teko', sans-serif; font-size: 34px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .creator-meta { font-size: 13px; color: var(--muted); margin: 6px 0 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .creator-desc { font-size: 14px; color: rgba(240,240,240,0.7); max-width: 640px; line-height: 1.6; }
    .creator-yt-link {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; background: var(--red); color: #fff;
      border: none; padding: 8px 18px; border-radius: 4px; font-size: 13px; font-weight: 700; text-decoration: none;
    }
    .creator-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; }
    .claim-box { margin-top: 12px; }
    .claim-form { margin-top: 10px; max-width: 420px; }
    .claim-form textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 9px 12px; border-radius: 4px; font-size: 13px; font-family: 'Inter', sans-serif; margin-bottom: 8px; resize: vertical;
    }
    @media (max-width: 700px) {
      .creator-wrap { padding: 20px 20px 40px; }
      .creator-hero { flex-direction: column; text-align: center; }
      .creator-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo-svg"><img src="/logo-horizantal.png" alt="GorkhaTV" class="nav-logo-img"></a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/pages/browse.html">Browse</a></li>
    <li><a href="/pages/feed.html">Shorts</a></li>
  </ul>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div class="creator-wrap">
  <div class="creator-hero" id="creator-hero">
    <div class="loading"><div class="spinner"></div></div>
  </div>
  <div class="creator-grid" id="creator-videos"></div>
</div>

<footer>
  <div class="footer-bottom" style="border-top:none;">
    <span>© 2026 GorkhaTV — Darjeeling in Every Frame</span>
    <span>Videos are hosted and played on YouTube. GorkhaTV indexes public metadata only.</span>
  </div>
</footer>

<div id="mobile-nav-root"></div>

<script type="module" src="/js/creator.js"></script>
<script type="module" src="/js/mobileNav.js"></script>
</body>
</html>
