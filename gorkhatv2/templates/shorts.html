<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shorts | GorkhaTV</title>
  <meta name="description" content="Darjeeling-region YouTube Shorts on GorkhaTV.">
  <link rel="icon" type="image/png" href="/logo-circle.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { overflow: hidden; } /* the feed itself scrolls, not the page */

    .shorts-feed {
      height: calc(100vh - 64px);
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      background: #000;
      /* touch-action tells the browser up front that vertical panning here
         belongs to page scroll — without it, a swipe that starts on top of
         the (cross-origin, separately-scrollable) YouTube iframe can be
         ambiguous and feel laggy before the browser commits to scrolling.
         overscroll-behavior-y stops that vertical scroll from also rubber-
         banding the outer page, which is what "not smooth" mostly looks like. */
      touch-action: pan-y;
      overscroll-behavior-y: contain;
    }
    @supports (height: 100dvh) {
      .shorts-feed { height: calc(100dvh - 64px); }
    }

    .shorts-slide {
      position: relative;
      height: calc(100vh - 64px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    @supports (height: 100dvh) {
      .shorts-slide { height: calc(100dvh - 64px); }
    }

    .shorts-poster {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: blur(28px) brightness(0.35);
      transform: scale(1.15);
    }

    /* True "contain" letterboxing computed from viewport units directly
       (both candidate sizes are absolute, so min() doesn't hit the usual
       CSS aspect-ratio circular-dependency problem) — a Short that's
       actually landscape (misclassified) just gets thicker letterbox bars
       instead of being cropped or stretched. */
    .shorts-player-frame {
      position: relative;
      z-index: 1;
      background: #000;
      width: min(100vw, calc((100vh - 64px) * 9 / 16));
      height: min(calc(100vh - 64px), calc(100vw * 16 / 9));
    }
    @supports (height: 100dvh) {
      .shorts-player-frame {
        width: min(100vw, calc((100dvh - 64px) * 9 / 16));
        height: min(calc(100dvh - 64px), calc(100vw * 16 / 9));
      }
    }
    .shorts-player-frame iframe { width: 100%; height: 100%; border: none; display: block; }

    /* Covers the *entire* slide, including the area over the native YouTube
       control bar — a swipe starting there would otherwise be captured by
       the cross-origin iframe instead of reaching our scroll container.
       This div only intercepts taps (mute toggle / double-tap like); the
       chrome underneath stays fully visible per YouTube ToS, just not
       directly clickable through it, the same trade every TikTok/Reels-
       style custom player makes. */
    .shorts-tap-catcher { position: absolute; inset: 0; z-index: 4; cursor: pointer; }

    .shorts-mute-flash {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center; font-size: 26px;
      z-index: 7; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .shorts-mute-flash.show { opacity: 1; transition: none; }

    .shorts-heart-burst {
      position: absolute; left: 50%; top: 50%; font-size: 84px; z-index: 8;
      opacity: 0; pointer-events: none; transform: translate(-50%,-50%) scale(0.4);
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    }
    .shorts-heart-burst.burst { animation: shortsHeartBurst 0.75s cubic-bezier(0.2,0.8,0.3,1) forwards; }
    @keyframes shortsHeartBurst {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
      30% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
      45% { transform: translate(-50%,-50%) scale(0.95); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.05); }
    }

    .shorts-scrim {
      position: absolute; left: 0; right: 0; bottom: 0; height: 45%;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      z-index: 5; pointer-events: none;
    }

    .shorts-info {
      position: absolute; left: 16px; right: 92px; bottom: 22px; z-index: 6;
      color: #fff;
    }
    .shorts-creator {
      display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-bottom: 6px;
    }
    .shorts-title { font-size: 13px; line-height: 1.4; color: rgba(255,255,255,0.92); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .shorts-meta { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 6px; display: flex; gap: 8px; }

    .shorts-actions {
      position: absolute; right: 10px; bottom: 22px; z-index: 6;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .shorts-action-btn {
      background: rgba(255,255,255,0.12); border: none; color: #fff; width: 44px; height: 44px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer; backdrop-filter: blur(4px); transition: background 0.15s, transform 0.15s;
    }
    .shorts-action-btn:active { transform: scale(0.9); }
    .shorts-action-btn.liked { background: var(--red); }
    .shorts-action-label { font-size: 10px; color: #fff; margin-top: 3px; text-align: center; }

    .shorts-loading, .shorts-empty {
      height: calc(100vh - 64px); display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted); gap: 12px; text-align: center; padding: 0 24px;
    }
    @supports (height: 100dvh) {
      .shorts-loading, .shorts-empty { height: calc(100dvh - 64px); }
    }

    .shorts-end {
      height: calc(100vh - 64px); scroll-snap-align: start;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted); gap: 10px; text-align: center; padding: 0 32px;
    }
    @supports (height: 100dvh) {
      .shorts-end { height: calc(100dvh - 64px); }
    }

    /* Comments are real YouTube data (read-only — see functions/api/videos/[id]/comments.js),
       shown in one shared bottom sheet reused across whichever slide is active
       rather than duplicated per-slide. */
    .shorts-comments-backdrop {
      position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.55);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .shorts-comments-backdrop.open { opacity: 1; pointer-events: auto; }

    .shorts-comments-sheet {
      position: fixed; left: 0; right: 0; z-index: 301;
      /* Parked off-screen via a large fixed viewport-relative offset, not a
         percentage of the sheet's own height — the sheet's content (and
         therefore its natural height) changes from a small spinner to a
         full comment list right as it opens, and a %-based transform
         recomputes against that changing height mid-transition, which is
         exactly what made this get stuck instead of sliding into view. */
      bottom: -100vh;
      max-height: 72vh; background: var(--surface); border-radius: 16px 16px 0 0;
      border-top: 1px solid var(--border);
      transition: bottom 0.25s ease;
      display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .shorts-comments-sheet.open { bottom: 0; }
    .shorts-comments-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      font-family: 'Teko', sans-serif; font-size: 20px; font-weight: 600; flex-shrink: 0;
    }
    .shorts-comments-close { background: none; border: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; }
    .shorts-comments-list { overflow-y: auto; padding: 6px 18px 18px; flex: 1; -webkit-overflow-scrolling: touch; }
    .shorts-comment-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .shorts-comment-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
    .shorts-comment-body { flex: 1; min-width: 0; }
    .shorts-comment-author { font-size: 12px; font-weight: 700; }
    .shorts-comment-text { font-size: 13px; color: rgba(240,240,240,0.85); line-height: 1.45; margin-top: 3px; overflow-wrap: break-word; }
    .shorts-comment-meta { font-size: 11px; color: var(--muted); margin-top: 5px; display: flex; gap: 12px; align-items: center; }

    /* On phones the bottom mobile nav (56px, see .mobile-nav in style.css)
       overlays the feed rather than pushing it up (body opts out of the
       padding-bottom push via .mobile-nav-overlay) — so the feed's own
       usable height needs to shrink by that same 56px here instead, or the
       last ~56px of each slide (and its Save/Share overlay) would sit
       underneath the nav bar. */
    @media (max-width: 700px) {
      .shorts-feed, .shorts-slide, .shorts-loading, .shorts-empty, .shorts-end { height: calc(100vh - 64px - 56px); }
      .shorts-player-frame {
        width: min(100vw, calc((100vh - 64px - 56px) * 9 / 16));
        height: min(calc(100vh - 64px - 56px), calc(100vw * 16 / 9));
      }
    }
    @supports (height: 100dvh) {
      @media (max-width: 700px) {
        .shorts-feed, .shorts-slide, .shorts-loading, .shorts-empty, .shorts-end { height: calc(100dvh - 64px - 56px); }
        .shorts-player-frame {
          width: min(100vw, calc((100dvh - 64px - 56px) * 9 / 16));
          height: min(calc(100dvh - 64px - 56px), calc(100vw * 16 / 9));
        }
      }
    }
  </style>
</head>

<nav>
  <a href="/" class="logo-svg"><img src="/logo-horizantal.png" alt="GorkhaTV" class="nav-logo-img"></a>
  <ul class="nav-links">

</nav>

<div class="shorts-feed" id="shorts-feed">

</div>

<div class="shorts-comments-backdrop" id="comments-backdrop"></div>
<div class="shorts-comments-sheet" id="comments-sheet">

    <span>Comments</span>
    <button class="shorts-comments-close" id="comments-close" aria-label="Close comments">✕</button>
  </div>

</div>

</body>
