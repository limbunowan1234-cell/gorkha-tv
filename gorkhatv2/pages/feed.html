<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed | GorkhaTV</title>
  <meta name="description" content="Scroll Darjeeling-region Shorts like a feed on GorkhaTV.">
  <link rel="icon" type="image/png" href="../logo-circle.png">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .feed-wrap { max-width: 470px; margin: 0 auto; padding: 20px 12px 50px; }
    .feed-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }

    .feed-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
    .feed-card-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
    .feed-card-creator { font-size: 13px; font-weight: 700; }
    .feed-card-location { font-size: 11px; color: var(--muted); }

    /* Explicit min()/calc() width+height (not the `aspect-ratio` property +
       an absolutely-inset child) — the aspect-ratio approach measured
       correctly via getBoundingClientRect() but produced a YouTube player
       with mismatched internal video-canvas sizing (black bars) on cards
       created later via the IntersectionObserver, confirmed in a real
       browser. This is the same technique already proven solid in
       templates/shorts.html, just bounded by the card's own max-width
       (446px = 470px column max-width minus the .feed-wrap side padding)
       instead of the full viewport. */
    .feed-media-wrap {
      position: relative; margin: 0 auto; background: #000;
      width: min(calc(100vw - 24px), 446px, calc(70vh * 9 / 16));
      height: min(70vh, calc((100vw - 24px) * 16 / 9), calc(446px * 16 / 9));
    }
    .feed-player-frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    .feed-player-frame iframe { width: 100%; height: 100%; border: none; display: block; }
    .feed-poster { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .feed-tap-catcher { position: absolute; inset: 0; z-index: 4; cursor: pointer; }
    .feed-mute-flash {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      z-index: 7; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .feed-mute-flash.show { opacity: 1; transition: none; }
    .feed-heart-burst {
      position: absolute; left: 50%; top: 50%; font-size: 72px; z-index: 8;
      opacity: 0; pointer-events: none; transform: translate(-50%,-50%) scale(0.4);
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    }
    .feed-heart-burst.burst { animation: feedHeartBurst 0.75s cubic-bezier(0.2,0.8,0.3,1) forwards; }
    @keyframes feedHeartBurst {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
      30% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
      45% { transform: translate(-50%,-50%) scale(0.95); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.05); }
    }

    .feed-actions-row { display: flex; align-items: center; gap: 16px; padding: 10px 14px 4px; }
    .feed-action-btn { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 4px; font-family: inherit; }
    .feed-action-btn.liked { color: var(--red); }
    .feed-action-count { font-size: 13px; color: var(--muted); font-weight: 600; }
    .feed-save-btn { margin-left: auto; text-decoration: none; }

    .feed-caption { padding: 4px 14px 6px; font-size: 13px; line-height: 1.5; color: rgba(240,240,240,0.9); }
    .feed-caption .creator { font-weight: 700; margin-right: 6px; }
    .feed-meta { padding: 0 14px 14px; font-size: 11px; color: var(--muted); }

    .feed-loading, .feed-empty, .feed-end {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--muted); text-align: center; padding: 60px 24px;
    }

    /* Comments drawer — identical markup/behavior to templates/shorts.html,
       driven by the shared gorkhatv2/js/commentsDrawer.js. */
    .shorts-comments-backdrop {
      position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.55);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .shorts-comments-backdrop.open { opacity: 1; pointer-events: auto; }
    .shorts-comments-sheet {
      position: fixed; left: 0; right: 0; z-index: 301;
      bottom: -100vh;
      max-height: 72vh; background: var(--surface); border-radius: 16px 16px 0 0;
      border-top: 1px solid var(--border);
      transition: bottom 0.25s ease;
      display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .shorts-comments-sheet.open { bottom: 0; }
    .shorts-comments-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      font-family: 'Teko', sans-serif; font-size: 20px; font-weight: 600; flex-shrink: 0;
    }
    .shorts-comments-close { background: none; border: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; }
    .shorts-comments-list { overflow-y: auto; padding: 6px 18px 18px; flex: 1; -webkit-overflow-scrolling: touch; }
    .shorts-comment-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .shorts-comment-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
    .shorts-comment-body { flex: 1; min-width: 0; }
    .shorts-comment-author { font-size: 12px; font-weight: 700; }
    .shorts-comment-text { font-size: 13px; color: rgba(240,240,240,0.85); line-height: 1.45; margin-top: 3px; overflow-wrap: break-word; }
    .shorts-comment-meta { font-size: 11px; color: var(--muted); margin-top: 5px; display: flex; gap: 12px; align-items: center; }

    @media (max-width: 700px) { body:not(.mobile-nav-overlay) { padding-bottom: 56px; } }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo-svg"><img src="../logo-horizantal.png" alt="GorkhaTV" class="nav-logo-img"></a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="browse.html">Browse</a></li>
    <li><a href="/shorts">Shorts</a></li>
    <li><a href="feed.html" class="active">Feed</a></li>
  </ul>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div class="feed-wrap" id="feed-wrap">
  <div class="feed-loading"><div class="spinner"></div></div>
</div>

<div class="shorts-comments-backdrop" id="comments-backdrop"></div>
<div class="shorts-comments-sheet" id="comments-sheet">
  <div class="shorts-comments-header">
    <span>Comments</span>
    <button class="shorts-comments-close" id="comments-close" aria-label="Close comments">✕</button>
  </div>
  <div class="shorts-comments-list" id="comments-list"></div>
</div>

<div id="mobile-nav-root"></div>

<script type="module" src="../js/feed.js"></script>
</body>
</html>
